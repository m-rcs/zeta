[build]
# v0 mangling scheme provides more detailed backtraces around closures
rustflags = ["-C", "symbol-mangling-version=v0", "--cfg", "tokio_unstable"]

[alias]
xtask = "run --package xtask --"
perf-test = ["test", "--profile", "release-fast", "--lib", "--bins", "--tests", "--all-features", "--config", "target.'cfg(true)'.runner='cargo run -p perf --release'", "--config", "target.'cfg(true)'.rustflags=[\"--cfg\", \"perf_enabled\"]"]
# Keep similar flags here to share some ccache
perf-compare = ["run", "--profile", "release-fast", "-p", "perf", "--config", "target.'cfg(true)'.rustflags=[\"--cfg\", \"perf_enabled\"]", "--", "compare"]

[target.'cfg(target_os = "windows")']
rustflags = [
    "--cfg",
    "windows_slim_errors",        # This cfg will reduce the size of `windows::core::Error` from 16 bytes to 4 bytes
    "-C",
    "target-feature=+crt-static", # This fixes the linking issue when compiling livekit on Windows
]

# We need lld to link libwebrtc.a successfully on aarch64-linux
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[env]
MACOSX_DEPLOYMENT_TARGET = "10.15.7"
# Tell `yeslogic-fontconfig-sys` to dlopen libfontconfig at runtime instead of
# linking against it. Required for the Android cross-build (the NDK ships no
# fontconfig); harmless on macOS/Windows (font-kit uses native APIs there);
# switches to dynamic loading on Linux hosts.
RUST_FONTCONFIG_DLOPEN = "on"

# Android NDK paths (CC_*, AR_*, linker) are injected by `cargo-ndk`, which
# auto-discovers the NDK from $ANDROID_NDK_HOME, $ANDROID_HOME/ndk/*, or the
# Android Studio bundled location. Install once with `cargo install cargo-ndk`,
# then build with:
#
#   cargo ndk -t arm64-v8a build -p zed_mobile
#
# The Gradle build in mobile/android/ invokes cargo-ndk internally, so the
# `./gradlew assembleDebug` path doesn't require any extra developer setup
# beyond having `cargo-ndk` on `$PATH` and an NDK installed.
